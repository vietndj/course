<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#090D16"/>
  <!-- Chữ V khổng lồ góc trái tràn mép nóc -->
  <text x="19" y="21" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="42" fill="#FFFFFF">V</text>
  <!-- Chữ I khổng lồ ở giữa -->
  <text x="38" y="21" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="42" fill="#FFFFFF">I</text>
  <!-- Chấm Đỏ REC khổng lồ cắt lẹm góc phải trên -->
  <circle cx="55" cy="15" r="9" fill="#EF4444"/>
  <circle cx="55" cy="15" r="3.5" fill="#FFFFFF" opacity="0.85"/>
  <!-- DEO tràn viền cực đại ở đáy -->
  <text x="32" y="49" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="32" letter-spacing="-1.5px" fill="#F8FAFC">DEO</text>
</svg>