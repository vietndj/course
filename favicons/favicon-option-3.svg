  <text x="32" y="20" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="43" letter-spacing="4px" fill="#FFFFFF">VI</text>
  <!-- Vạch phân tầng điện ảnh cắt xén -->
