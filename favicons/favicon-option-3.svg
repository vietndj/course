<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#1E3A8A"/>
  <!-- Dải sáng góc máy -->
  <path d="M0 0 L24 0 L0 24 Z" fill="#3B82F6" opacity="0.6"/>
