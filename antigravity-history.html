                    : '';
                const artsList = it.artifacts && it.artifacts.length > 0
                    ? `<div class="tag-list">${it.artifacts.map(a => `<span class="tag-item">📎 ${a}</span>`).join('')}</div>`
                    : '';

                return `
                <div class="conv-card">
                    <div class="card-header">
                        <div class="card-title">${it.title || '(Không có tiêu đề)'}</div>
                        <div class="card-badges">
                            <span class="badge badge-date">📅 ${it.created_at}</span>
                            <span class="badge badge-steps">⚡ ${it.step_count} steps</span>
                            ${artBadges}
                        </div>
                    </div>
                    
                    <div class="card-id" onclick="copyText('${it.id}')" title="Nhấp để copy ID">
                        ID: ${it.id}
                    </div>

                    <div class="prompt-preview">
                        <strong>💬 Yêu cầu của anh Việt:</strong><br>
                        ${it.first_prompt}
                    </div>

                    ${artsList}

                    <div class="card-actions">
                        <span>Lệnh AI tra cứu: <code>Xem transcript ${it.id.substring(0,8)}</code></span>
                        <button class="btn-copy" onclick="copyText('Hãy đọc transcript cuộc trò chuyện ${it.id} và giải thích lại giúp anh')">📋 Copy Prompt Cho AI</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function filterConversations() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            let filtered = rawData.filter(it => {
                const matchSearch = !query || 
                    (it.id && it.id.toLowerCase().includes(query)) ||
                    (it.title && it.title.toLowerCase().includes(query)) ||
                    (it.first_prompt && it.first_prompt.toLowerCase().includes(query)) ||
                    (it.artifacts && it.artifacts.some(a => a.toLowerCase().includes(query)));
                
                if (!matchSearch) return false;

                if (currentFilter === 'has_artifacts') {
                    return it.artifacts && it.artifacts.length > 0;
                }
                if (currentFilter === 'recent') {
                    return true;
                }
                return true;
            });

            renderList(filtered);
        }

        function setFilter(filterType, btn) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterConversations();
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Đã copy: ' + text);
            }).catch(err => {
                prompt('Copy mã này:', text);
            });
        }

        // Khởi chạy ban đầu
        renderList(rawData);
    </script>
</body>
</html>
